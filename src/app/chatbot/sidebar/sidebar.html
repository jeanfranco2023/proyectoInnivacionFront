<!-- SIDEBAR RESPONSIVE -->
<aside
  class="fixed lg:relative z-30 flex h-full w-[85vw] max-w-80 flex-col border-r border-blue-200 bg-white/95 px-4 py-4 text-slate-700 shadow-2xl shadow-blue-200/40 transition-transform duration-300 ease-in-out transform sm:w-80 sm:px-5 sm:py-5 lg:transform-none lg:translate-x-0 dark:border-slate-800 dark:bg-gradient-to-b dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100 dark:shadow-slate-950/30"
  [class.translate-x-0]="mobileSidebarOpen"
  [class.-translate-x-full]="!mobileSidebarOpen">

  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-100 ring-1 ring-blue-200 backdrop-blur-sm dark:bg-white/10 dark:ring-white/10">
        <img src="/perfilSlimeWhite.png" class="w-7" alt="MentorCore logo">
      </div>
      <div>
        <h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-white">MentorCore</h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400">Asistente académico</p>
      </div>
    </div>
    <button (click)="closeSidebar()" class="lg:hidden rounded-full p-2 text-slate-500 transition-colors hover:bg-blue-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/5 dark:hover:text-white" aria-label="Cerrar barra lateral">
      ✕
    </button>
  </div>

  <!-- NAVEGACIÓN PRINCIPAL GLOBAL (Chatbot, Foro, Dashboard) -->
  <nav class="mb-5 space-y-1">
    <a routerLink="/chat" routerLinkActive="!bg-blue-100/70 !text-blue-700 dark:!bg-white/10 dark:!text-white font-medium"
       (click)="closeSidebarOnMobile()"
       class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm transition-all duration-200 hover:bg-blue-50/50 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300">
      <i class="fa-solid fa-comments text-base text-blue-500 dark:text-sky-400"></i>
      <span>Chatbot</span>
    </a>
    <a routerLink="/foro" routerLinkActive="!bg-blue-100/70 !text-blue-700 dark:!bg-white/10 dark:!text-white font-medium"
       (click)="closeSidebarOnMobile()"
       class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm transition-all duration-200 hover:bg-blue-50/50 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300">
      <i class="fa-solid fa-users text-base text-emerald-500 dark:text-emerald-400"></i>
      <span>Foro Académico</span>
    </a>
    <a *ngIf="isAdmin" routerLink="/dashboard" routerLinkActive="!bg-blue-100/70 !text-blue-700 dark:!bg-white/10 dark:!text-white font-medium"
       (click)="closeSidebarOnMobile()"
       class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm transition-all duration-200 hover:bg-blue-50/50 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300">
      <i class="fa-solid fa-chart-line text-base text-violet-500 dark:text-violet-400"></i>
      <span>Dashboard Admin</span>
    </a>
  </nav>

  <!-- SECCIÓN ESPECÍFICA PARA EL CHATBOT (SOLO SE MUESTRA EN /chat) -->
  <ng-container *ngIf="isActiveRoute('/chat')">
    <hr class="border-blue-100 mb-5 dark:border-slate-800" />
    
    <button (click)="onNewChat.emit(); closeSidebarOnMobile()"
            class="mb-5 inline-flex items-center justify-center gap-2 rounded-2xl border border-blue-200 bg-blue-600 px-4 py-3 text-sm font-medium text-white shadow-lg shadow-blue-300/40 transition-all hover:bg-blue-700 dark:border-sky-400/20 dark:bg-sky-400/10 dark:text-sky-100 dark:shadow-sky-950/20 dark:hover:border-sky-300/30 dark:hover:bg-sky-400/15">
      <i class="fa-solid fa-plus text-xs"></i>
      Nuevo chat
    </button>

    <div class="mb-5">
      <label for="chat-search" class="mb-2 block text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">Buscar conversaciones</label>
      <input id="chat-search" type="text" placeholder="Escribe para filtrar..." [ngModel]="searchTerm" (ngModelChange)="searchTermChange.emit($event)"
             class="w-full rounded-2xl border border-blue-200 bg-white px-4 py-3 text-sm text-slate-700 outline-none placeholder:text-slate-400 transition focus:border-blue-300 focus:ring-2 focus:ring-blue-200 dark:border-white/10 dark:bg-white/5 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-sky-400/30 dark:focus:bg-white/10 dark:focus:ring-sky-400/15">
    </div>

    <div class="chat-list-scroll mc-stagger-list flex-1 space-y-6 overflow-y-auto pr-1">
      <div *ngIf="isLoadingChats" class="rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-slate-600 dark:border-white/10 dark:bg-white/5 dark:text-slate-300">
        Cargando chats...
      </div>
      <div *ngIf="!isLoadingChats && misChats.length === 0" class="rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-slate-600 dark:border-white/10 dark:bg-white/5 dark:text-slate-300">
        No tienes chats guardados todavía.
      </div>

      <!-- Sección de Chats Guardados -->
      <div class="space-y-3" *ngIf="!isLoadingChats && misChats.length > 0">
        <p class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-500">
          <i class="fa-regular fa-folder-open text-xs"></i> Mis Chats
        </p>
        <div *ngFor="let chat of misChats; let i = index"
             class="chat-item-card mc-stagger-item group flex items-center gap-2 rounded-3xl bg-white px-2 py-2 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-50 dark:bg-white/5 dark:hover:bg-white/10"
             [class.!bg-blue-100/50]="chat.id === activeChatId"
             [class.dark:!bg-white/10]="chat.id === activeChatId"
             [style.--mc-index]="i">
          <button type="button"
                  (click)="onSelectChat.emit(chat)"
                  class="min-w-0 flex-1 rounded-2xl px-2 py-2 text-left">
            <p class="truncate text-sm font-semibold text-slate-800 dark:text-slate-100" 
               [class.text-blue-600]="chat.id === activeChatId" 
               [class.dark:text-sky-300]="chat.id === activeChatId">{{ chat.titulo }}</p>
          </button>
          <div class="flex items-center gap-1 pr-1">
            <button type="button"
                    (click)="onRenameChat.emit(chat)"
                    class="rounded-xl p-2 text-slate-500 transition hover:bg-blue-100 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
                    title="Editar nombre"
                    aria-label="Editar nombre">
              <i class="fa-regular fa-pen-to-square text-xs"></i>
            </button>
            <button type="button"
                    (click)="onDeleteChat.emit(chat)"
                    class="rounded-xl p-2 text-red-500 transition hover:bg-red-50 hover:text-red-600 dark:text-red-300 dark:hover:bg-red-500/10"
                    title="Eliminar chat"
                    aria-label="Eliminar chat">
              <i class="fa-regular fa-trash-can text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <div *ngIf="!isActiveRoute('/chat')" class="flex-1"></div>

  <!-- Menú de usuario -->
  <div class="relative mt-5 rounded-3xl border border-blue-200 bg-blue-50 p-3 dark:border-white/10 dark:bg-white/5" tabindex="0" role="presentation" (click)="$event.stopPropagation()">
    <button type="button" (click)="toggleUserMenu($event)"
            class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition hover:bg-blue-100 dark:hover:bg-white/5"
            [attr.aria-expanded]="isUserMenuOpen">
      <img [src]="profileImageUrl || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Seven'"
           class="h-10 w-10 rounded-full border border-blue-200 bg-blue-200 shadow dark:border-white/10 object-cover" alt="Perfil">
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-slate-800 dark:text-white">{{ nombreUsuario }}</p>
        <p class="truncate text-[11px] text-slate-500 dark:text-slate-400">Sesión activa</p>
      </div>
      <span class="text-xs text-slate-500 transition-transform" [class.rotate-90]="isUserMenuOpen">❯</span>
    </button>
    <div *ngIf="isUserMenuOpen" class="mc-message-in absolute bottom-full left-0 right-0 z-40 mb-2 overflow-hidden rounded-2xl border border-blue-200 bg-white backdrop-blur-md transition-all duration-200 dark:border-white/10 dark:bg-slate-950/70">
      <button class="flex w-full items-center gap-2 px-4 py-3 text-left text-sm text-slate-700 transition hover:bg-blue-100 dark:text-slate-200 dark:hover:bg-white/5" (click)="onUserMenuAction('profile')">
        <i class="fa-regular fa-user text-xs"></i> Perfil
      </button>
      <button class="flex w-full items-center gap-2 px-4 py-3 text-left text-sm text-slate-700 transition hover:bg-blue-100 dark:text-slate-200 dark:hover:bg-white/5" (click)="onUserMenuAction('theme')">
        <i [class]="isDarkMode ? 'fa-regular fa-sun text-xs' : 'fa-regular fa-moon text-xs'"></i> {{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}
      </button>
      <button class="flex w-full items-center gap-2 px-4 py-3 text-left text-sm text-red-600 transition hover:bg-red-50 dark:text-red-200 dark:hover:bg-red-500/10" (click)="onUserMenuAction('logout')">
        <i class="fa-solid fa-right-from-bracket text-xs"></i> Cerrar sesión
      </button>
    </div>
  </div>
</aside>

<!-- Backdrop móvil -->
<button *ngIf="mobileSidebarOpen" (click)="closeSidebar()"
        class="fixed inset-0 z-20 cursor-default bg-blue-950/50 backdrop-blur-sm lg:hidden"></button>
