<div class="mc-page-enter flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 px-4 py-6 text-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100 sm:py-10">
  <div class="mc-card w-full max-w-lg p-5 text-center sm:p-8">
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-3xl bg-blue-600 text-white shadow-lg shadow-blue-300/40 dark:bg-sky-500 dark:text-slate-950">
      <i class="fa-solid fa-share-nodes text-2xl"></i>
    </div>
    <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Importar chat compartido</h1>
    <p class="mt-3 text-sm leading-6 text-slate-500 dark:text-slate-400">{{ statusMessage }}</p>

    <div *ngIf="isLoading" class="mt-6 flex items-center justify-center gap-2 text-sm text-slate-500 dark:text-slate-400">
      <span class="h-2.5 w-2.5 animate-pulse rounded-full bg-blue-500"></span>
      Importando chat completo...
    </div>

    <div *ngIf="!isLoading && isError" class="mt-6 flex justify-center">
      <a routerLink="/login"
         class="mc-button inline-flex items-center rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
        Ir al login
      </a>
    </div>
  </div>
</div>
