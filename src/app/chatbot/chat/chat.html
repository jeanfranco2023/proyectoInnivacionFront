<div class="flex h-screen w-full bg-[#f8fafc] font-sans">

  <aside class="w-80 bg-[#5c91f1] flex flex-col p-5 text-white shadow-2xl">
    <div class="flex items-center gap-3 mb-8">
      <div class="bg-white p-2 rounded-xl shadow-md">
        <img src="perfilSlimeWhite.png" class="w-7" alt="MentorCore logo">
      </div>
      <h1 class="text-2xl font-bold tracking-tight">MentorCore</h1>
    </div>

    <button (click)="resetChat()"
      class="bg-white/20 hover:bg-white/30 transition-all p-3 rounded-full mb-6 border border-white/20 font-semibold shadow-lg">
      + New chat
    </button>

    <input type="text" placeholder="Buscar conversaciones" [(ngModel)]="searchTerm"
      class="w-full bg-white/20 rounded-lg py-2 px-4 mb-6 placeholder:text-white/70 outline-none text-sm border border-transparent focus:border-white/40">
    <div class="flex-1 overflow-y-auto space-y-6">
      <div *ngIf="favoritos.length > 0" class="mb-6">
        <p class="text-[10px] font-black opacity-70 mb-3 uppercase tracking-widest">Favoritos</p>
        <div *ngFor="let chat of favoritos" (click)="cargarChat(chat)"
          class="flex items-center justify-between p-2 hover:bg-white/10 rounded-lg cursor-pointer group transition-colors">

          <span class="text-sm truncate opacity-90 flex-1">{{ chat.titulo }}</span>

          <button (click)="marcarFavorito($event, chat)" class="ml-2 p-1 hover:scale-125 transition-transform">
            <span class="text-yellow-300 text-lg">★</span>
          </button>
        </div>
      </div>

      <div *ngIf="promptsGenerales.length > 0">
        <p class="text-[10px] font-black opacity-70 mb-3 uppercase tracking-widest">Prompts</p>
        <div *ngFor="let chat of promptsGenerales" (click)="cargarChat(chat)"
          class="flex items-center justify-between p-2 hover:bg-white/10 rounded-lg cursor-pointer group transition-colors">

          <span class="text-sm truncate opacity-90 flex-1">{{ chat.titulo }}</span>

          <button (click)="marcarFavorito($event, chat)" class="ml-2 p-1 hover:scale-125 transition-transform">
            <span class="opacity-30 group-hover:opacity-100 text-white text-lg">☆</span>
          </button>
        </div>
      </div>
    </div>

    <div
      class="flex items-center gap-3 border-t border-white/20 pt-5 mt-4 hover:bg-white/5 p-2 rounded-xl cursor-pointer">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Seven"
        class="w-10 h-10 rounded-full bg-blue-200 border-2 border-white shadow" alt="Perfil del usuario">
      <div class="flex-1">
        <p class="font-bold text-sm">{{ nombreUsuario }}</p>
      </div>
      <span class="text-xs opacity-50">❯</span>
    </div>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="h-16 border-b bg-white flex items-center justify-between px-8 shadow-sm">
      <div class="flex items-center gap-2 cursor-pointer">
        <span class="font-bold text-slate-800 text-lg">MentorCore</span>
        <span class="text-xs text-slate-400">▼</span>
      </div>
      <div class="flex gap-4 text-slate-400">
        <button class="hover:text-blue-500 transition-colors">📤</button>
        <button class="hover:text-blue-500 transition-colors">⋮</button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-10">
      <div *ngIf="messages.length === 0" class="flex flex-col items-center justify-center h-full text-center">
        <img src="SmileWhite.png" class="w-32 h-32 object-contain mb-8 " alt="MentorCore welcome icon">
        <h1 class="text-4xl font-extrabold text-slate-900 mb-2">¡Hola! Soy tu asistente de MentorCore</h1>
        <p class="text-3xl font-extrabold text-blue-500">¿En qué puedo ayudarte hoy?</p>
      </div>

      <div class="max-w-3xl mx-auto space-y-6">
        <div *ngFor="let m of messages" [ngClass]="m.role === 'user' ? 'justify-end' : 'justify-start'"
          class="flex w-full">

          <div
            [ngClass]="m.role === 'user' ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none' : 'bg-white text-slate-700 border border-slate-100 rounded-2xl rounded-tl-none'"
            class="p-4 px-6 shadow-xl max-w-lg text-lg leading-relaxed">

            <div *ngIf="m.isFile"
              class="flex items-center gap-4 bg-black/10 p-3 rounded-xl border border-white/20 mb-1">
              <div class="bg-white/20 p-2 rounded-lg">
                <i class="fa-solid fa-file-pdf text-3xl"></i>
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-bold truncate max-w-[200px]">{{ m.text }}</span>
                <span class="text-[10px] opacity-70 uppercase font-black tracking-tighter">Documento PDF</span>
              </div>
            </div>

            <p *ngIf="!m.isFile">{{ m.text }}</p>

          </div>
        </div>
      </div>
    </div>

    <div class="p-8 bg-gradient-to-t from-slate-50">
      <div
        class="max-w-4xl mx-auto relative flex items-center bg-white border-2 border-blue-50 rounded-3xl p-3 shadow-2xl focus-within:border-blue-400 transition-all">
        <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Pregunta a MentorCore"
          class="flex-1 p-3 px-5 outline-none text-lg text-slate-700 bg-transparent">

        <div class="flex gap-4 px-4 items-center">
          <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none">

          <button (click)="fileInput.click()" title="Subir archivo"
            class="text-blue-500 text-2xl hover:scale-110 active:scale-95 transition-all">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
          </button>
          <button (click)="dictar()" [class.text-red-500]="isListening" title="Usar micrófono"
            class="text-blue-500 text-2xl hover:scale-110 active:scale-95 transition-all flex items-center justify-center">

            <i [class]="isListening ? 'fa-solid fa-microphone-lines-slash' : 'fa-solid fa-microphone-lines'"></i>

          </button>
          <button (click)="sendMessage()" title="Enviar mensaje"
            class="bg-blue-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center hover:bg-blue-600 shadow-lg shadow-blue-200 transition-all active:scale-90">
            ▲
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
