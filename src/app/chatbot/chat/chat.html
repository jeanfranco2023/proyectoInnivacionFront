<div class="flex h-screen w-full bg-slate-50 font-sans overflow-hidden dark:bg-slate-900" [class.dark]="isDarkMode">

  <!-- SIDEBAR RESPONSIVE -->
  <aside
    class="fixed lg:relative z-30 w-80 bg-blue-500 flex flex-col p-5 text-white shadow-2xl transition-transform duration-300 ease-in-out transform lg:transform-none lg:translate-x-0 h-full"
    [class.translate-x-0]="mobileSidebarOpen"
    [class.-translate-x-full]="!mobileSidebarOpen">

    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="bg-white p-2 rounded-xl shadow-md">
          <img src="/perfilSlimeWhite.png" class="w-7" alt="MentorCore logo">
        </div>
        <h1 class="text-2xl font-bold tracking-tight">MentorCore</h1>
      </div>
      <button (click)="closeSidebar()" class="lg:hidden text-white/80 hover:text-white text-2xl font-bold p-1">
        ✕
      </button>
    </div>

    <button (click)="resetChat(); closeSidebarOnMobile()"
            class="bg-white/20 hover:bg-white/30 transition-all p-3 rounded-full mb-6 border border-white/20 font-semibold shadow-lg">
      + New chat
    </button>

    <input type="text" placeholder="Buscar conversaciones" [(ngModel)]="searchTerm"
           class="w-full bg-white/20 rounded-lg py-2 px-4 mb-6 placeholder:text-white/70 outline-none text-sm border border-transparent focus:border-white/40">

    <div class="flex-1 overflow-y-auto space-y-6">
      <div *ngIf="favoritos.length > 0" class="mb-6">
        <p class="text-[10px] font-black opacity-70 mb-3 uppercase tracking-widest">Favoritos</p>
        <div *ngFor="let chat of favoritos" class="flex items-center justify-between p-2 hover:bg-white/10 rounded-lg group">
          <button (click)="cargarChat(chat); closeSidebarOnMobile()"
                  class="text-sm truncate opacity-90 flex-1 text-left cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-white/50 rounded">
            {{ chat.titulo }}
          </button>
          <button (click)="marcarFavorito($event, chat)"
                  class="ml-2 p-1 hover:scale-125 transition-transform cursor-pointer">
            <span class="text-yellow-300 text-lg">★</span>
          </button>
        </div>
      </div>

      <div *ngIf="promptsGenerales.length > 0">
        <p class="text-[10px] font-black opacity-70 mb-3 uppercase tracking-widest">Prompts</p>
        <div *ngFor="let chat of promptsGenerales" class="flex items-center justify-between p-2 hover:bg-white/10 rounded-lg group">
          <button (click)="cargarChat(chat); closeSidebarOnMobile()"
                  class="text-sm truncate opacity-90 flex-1 text-left cursor-pointer">
            {{ chat.titulo }}
          </button>
          <button (click)="marcarFavorito($event, chat)" class="ml-2 p-1 hover:scale-125 transition-transform">
            <span class="opacity-30 group-hover:opacity-100 text-white text-lg">☆</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Menú de usuario -->
    <div class="border-t border-white/20 pt-5 mt-4 p-2 rounded-xl" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <button type="button" (click)="toggleUserMenu($event)"
              class="w-full flex items-center gap-3 hover:bg-white/5 rounded-xl p-2"
              [attr.aria-expanded]="isUserMenuOpen">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Seven"
             class="w-10 h-10 rounded-full bg-blue-200 border-2 border-white shadow" alt="Perfil">
        <div class="flex-1 text-left">
          <p class="font-bold text-sm">{{ nombreUsuario }}</p>
        </div>
        <span class="text-xs opacity-60 transition-transform" [class.rotate-90]="isUserMenuOpen">❯</span>
      </button>
      <div *ngIf="isUserMenuOpen" class="bg-white/10 backdrop-blur-md rounded-xl mt-2 py-2">
        <button class="w-full text-left px-4 py-2 hover:bg-white/10 flex gap-2" (click)="onUserMenuAction('profile')">
          <span>👤</span> Perfil
        </button>
        <button class="w-full text-left px-4 py-2 hover:bg-white/10 flex gap-2" (click)="onUserMenuAction('settings')">
          <span>⚙️</span> Preferencias
        </button>
        <button class="w-full text-left px-4 py-2 hover:bg-white/10 flex gap-2" (click)="onUserMenuAction('theme')">
          <span>{{ isDarkMode ? '☀️' : '🌙' }}</span> {{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}
        </button>
        <button class="w-full text-left px-4 py-2 hover:bg-white/10 flex gap-2 text-red-200" (click)="onUserMenuAction('logout')">
          <span>⎋</span> Cerrar sesión
        </button>
      </div>
    </div>
  </aside>

  <!-- Backdrop móvil -->
  <button *ngIf="mobileSidebarOpen" (click)="closeSidebar()"
          class="fixed inset-0 bg-black/50 z-20 lg:hidden cursor-default"></button>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col w-full overflow-hidden">
    <header class="h-16 border-b bg-white dark:bg-slate-800 flex items-center justify-between px-4 sm:px-8 shadow-sm">
      <div class="flex items-center gap-3">
        <button (click)="toggleSidebar()" class="lg:hidden text-slate-600 dark:text-slate-300 hover:text-blue-500 text-2xl">☰</button>
        <div class="flex items-center gap-2 cursor-pointer">
          <div>
            <p class="font-bold text-slate-800 dark:text-white text-base sm:text-lg">MentorCore</p>
            <p class="text-[11px] text-slate-400 dark:text-slate-400">Asistente de innovación</p>
          </div>
          <span class="text-xs text-slate-400">▼</span>
        </div>
      </div>
      <div class="flex gap-3 text-slate-400 items-center">
        <span class="hidden sm:inline-flex text-sm dark:text-slate-300">{{ selectedProvider }} · {{ selectedModel }}</span>
        <button class="hover:text-blue-500">📤</button>
        <button class="hover:text-blue-500">⋮</button>
      </div>
    </header>

    <!-- Mensajes -->
    <div class="flex-1 overflow-y-auto p-2 sm:p-3 md:p-4">
      <div *ngIf="messages.length === 0" class="flex flex-col items-center justify-center h-full text-center px-2">
        <img src="/SmileWhite.png" class="w-28 h-28 sm:w-32 sm:h-32 object-contain mb-6" alt="Welcome">
        <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white mb-2">¡Hola! Soy tu asistente de MentorCore</h1>
        <p class="text-lg sm:text-xl md:text-2xl font-extrabold text-blue-500">¿En qué puedo ayudarte hoy?</p>
      </div>
      <div class="w-full lg:w-[92%] lg:max-w-[92%] mx-auto space-y-4">
        <div *ngFor="let m of messages" [ngClass]="m.role === 'user' ? 'justify-end' : 'justify-start'" class="flex w-full">
          <div [ngClass]="m.role === 'user' ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-100 dark:border-slate-700 rounded-2xl rounded-tl-none'"
               class="p-2.5 sm:p-3 px-3 sm:px-4 max-w-[92%] sm:max-w-[88%] text-sm sm:text-base leading-relaxed break-words shadow-md">
            <div *ngIf="m.isFile" class="flex items-center gap-4 bg-black/10 p-3 rounded-xl border border-white/20 mb-1">
              <i class="fa-solid fa-file-pdf text-2xl sm:text-3xl"></i>
              <div>
                <span class="text-sm font-bold truncate max-w-[150px]">{{ m.text }}</span>
                <span class="text-[10px] opacity-70 uppercase block">PDF</span>
              </div>
            </div>
            <p *ngIf="!m.isFile && m.role === 'user'">{{ m.text }}</p>
            <div *ngIf="!m.isFile && m.role === 'bot'" [innerHTML]="m.html || m.text"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer con input elegante -->
    <div class="px-3 sm:px-4 pb-3 sm:pb-4 pt-2 bg-gradient-to-t from-slate-50 dark:from-slate-900/50 to-transparent">
      <div class="w-full max-w-2xl mx-auto mb-2 flex flex-wrap items-center justify-end gap-2 text-[11px] sm:text-xs overflow-visible">
        <!-- Dropdown personalizado para Agente -->
        <div class="relative inline-block text-left" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
          <button type="button" (click)="toggleProviderDropdown()"
                  class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-100 hover:bg-slate-200/80 dark:hover:bg-slate-700/80 transition-all whitespace-nowrap min-h-8 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/60">
            <span>🤖</span>
            <span class="font-medium capitalize">{{ selectedProvider }}</span>
            <svg class="w-3 h-3 transition-transform" [class.rotate-180]="providerDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div *ngIf="providerDropdownOpen"
               class="absolute right-0 bottom-full mb-2 w-44 rounded-2xl bg-white/95 dark:bg-slate-800/95 backdrop-blur-md shadow-xl border border-slate-200/90 dark:border-slate-700 z-30 overflow-hidden">
            <button *ngFor="let p of providerOptions" (click)="selectProvider(p.value)"
                    class="block w-full text-left px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700/90 transition-colors capitalize">
            {{ p.label }}
            </button>
          </div>
        </div>

        <!-- Selector de modelo (igual al de agente) -->
        <div class="relative inline-block text-left" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
          <button type="button" (click)="toggleModelDropdown()"
                  class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-100 hover:bg-slate-200/80 dark:hover:bg-slate-700/80 transition-all whitespace-nowrap min-h-8 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/60">
            <span>🧠</span>
            <span class="font-medium max-w-[8rem] sm:max-w-[11rem] truncate">{{ selectedModel }}</span>
            <svg class="w-3 h-3 transition-transform" [class.rotate-180]="modelDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div *ngIf="modelDropdownOpen"
               class="absolute right-0 bottom-full mb-2 w-56 rounded-2xl bg-white/95 dark:bg-slate-800/95 backdrop-blur-md shadow-xl border border-slate-200/90 dark:border-slate-700 z-30 overflow-hidden">
            <button *ngFor="let m of getModelOptions()" (click)="selectModel(m)"
                    class="block w-full text-left px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700/90 transition-colors">
            {{ m }}
            </button>
          </div>
        </div>
      </div>

      <!-- Input principal -->
      <div class="w-full max-w-2xl mx-auto relative">
        <div class="relative flex items-end bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-2xl shadow-slate-200/30 dark:shadow-slate-900/40 transition-all duration-200 focus-within:shadow-2xl focus-within:border-blue-300 focus-within:ring-1 focus-within:ring-blue-300/50 -translate-y-1 px-1.5 py-1.5">
          <textarea #messageTextarea
                    [(ngModel)]="userInput"
                    (keydown.enter)="onMessageEnter($event)"
                    (input)="autoResizeMessage($event)"
                    rows="1"
                    placeholder="Escribe tu pregunta aquí..."
                    class="flex-1 resize-none overflow-hidden py-1.5 sm:py-2 pl-3 pr-2 outline-none text-xs sm:text-sm text-slate-700 dark:text-slate-200 bg-transparent placeholder:text-slate-400/70 dark:placeholder:text-slate-500 leading-snug min-h-[2.25rem] max-h-[8.75rem]"></textarea>
          <div class="flex items-center gap-1 pr-2">
            <input type="file" #fileInput (change)="onFileSelected($event)" class="hidden">
            <button (click)="fileInput.click()" title="Adjuntar archivo"
                    class="text-slate-400 hover:text-blue-500 transition-all p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700">
              <i class="fa-regular fa-paperclip text-base"></i>
            </button>
            <button (click)="dictar()" [class.text-red-500]="isListening" title="Entrada de voz"
                    class="text-slate-400 hover:text-blue-500 transition-all p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700">
              <i [class]="isListening ? 'fa-solid fa-microphone-slash animate-pulse' : 'fa-solid fa-microphone'"></i>
            </button>
            <button (click)="sendMessage()" [disabled]="isSending" title="Enviar mensaje"
                    class="bg-blue-500 text-white rounded-lg w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-md hover:bg-blue-600 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-arrow-up text-xs sm:text-sm"></i>
            </button>
          </div>
        </div>
        <p *ngIf="micStatusMessage" [ngClass]="{'text-red-500': micStatusType === 'error', 'text-green-600': micStatusType === 'success', 'text-slate-500': micStatusType === 'info'}"
           class="mt-2 px-2 text-xs text-center">{{ micStatusMessage }}</p>
        <p class="mt-1 px-2 text-[11px] text-center text-slate-400 dark:text-slate-500">
          MentorCore puede cometer errores. Revisa las respuestas.
        </p>
      </div>
    </div>
  </main>
</div>
