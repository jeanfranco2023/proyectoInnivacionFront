<div class="mc-auth-shell mc-auth-shell-ink">
  <div class="mx-auto flex min-h-[calc(100dvh-3rem)] w-full max-w-md items-center justify-center sm:min-h-[calc(100dvh-4rem)]">
    <div class="mc-auth-panel w-full p-6 sm:p-10">
      <div class="mb-6 text-center sm:mb-8">
        <div class="mc-auth-badge mx-auto mb-4 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold uppercase tracking-[0.18em]">
          <img src="/SmileWhite.png" alt="MentorCore" class="h-5 w-5 object-contain">
          MentorCore
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-100">Nueva contraseña</h1>
        <p *ngIf="step === 1" class="mc-auth-muted mt-2 text-sm leading-6">Hemos enviado un código de 6 dígitos a <strong>{{ email }}</strong>.</p>
        <p *ngIf="step === 2" class="mc-auth-muted mt-2 text-sm leading-6">Ingresa tu nueva contraseña para <strong>{{ email }}</strong>.</p>
      </div>

      <form class="space-y-4" (ngSubmit)="step === 1 ? verifyCode() : submitPassword()" autocomplete="off">
        <ng-container *ngIf="step === 1">
          <div class="space-y-2">
          <label for="code" class="block text-sm font-medium text-slate-300">Código de 6 dígitos</label>
          <div class="relative">
            <i class="fa-solid fa-key pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #codeInput id="code" type="text" [(ngModel)]="code" name="code"
                   (ngModelChange)="onCodeInput()"
                   maxlength="6"
                   class="mc-auth-input w-full rounded-2xl px-11 py-3 text-center text-xl font-bold tracking-widest outline-none transition"
                   placeholder="000000">
          </div>
          <p *ngIf="fieldErrors.code" class="text-xs text-red-300">{{ fieldErrors.code }}</p>
        </div>
        </ng-container>

        <ng-container *ngIf="step === 2">
        <div class="space-y-2">
          <label for="newPassword" class="block text-sm font-medium text-slate-300">Nueva contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #passwordInput id="newPassword" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword"
                   (ngModelChange)="onPasswordInput()"
                   class="mc-auth-input w-full rounded-2xl px-11 py-3 pr-12 text-sm outline-none transition"
                   placeholder="Mínimo 6 caracteres">
            <button type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-700/70 hover:text-slate-100"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
          <p *ngIf="fieldErrors.newPassword" class="text-xs text-red-300">{{ fieldErrors.newPassword }}</p>
        </div>

        <div class="space-y-2">
          <label for="confirmPassword" class="block text-sm font-medium text-slate-300">Confirmar contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input id="confirmPassword" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword"
                   (ngModelChange)="onPasswordInput()"
                   class="mc-auth-input w-full rounded-2xl px-11 py-3 pr-12 text-sm outline-none transition"
                   placeholder="Repite tu contraseña">
          </div>
          <p *ngIf="fieldErrors.confirmPassword" class="text-xs text-red-300">{{ fieldErrors.confirmPassword }}</p>
        </div>
        </ng-container>

        <button type="submit" [disabled]="isLoading"
          class="mc-primary-btn flex w-full items-center justify-center rounded-2xl px-4 py-3 text-sm font-semibold transition mt-2">
          <ng-container *ngIf="isLoading; else btnText">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Procesando...
          </ng-container>
          <ng-template #btnText>{{ step === 1 ? 'Validar código' : 'Restablecer contraseña' }}</ng-template>
        </button>

        <p *ngIf="errorMessage" class="rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-200">
          {{ errorMessage }}
        </p>

        <p *ngIf="successMessage" class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200 text-center font-medium">
          <i class="fa-solid fa-check-circle mr-1"></i> {{ successMessage }}
        </p>
      </form>

      <div class="mc-auth-muted mt-5 text-center text-sm">
        <a routerLink="/login" class="mc-auth-link font-semibold transition">Cancelar</a>
      </div>
    </div>
  </div>

  <div *ngIf="showErrorModal && errorMessage"
       class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm"
       role="button"
       tabindex="0"
       (click)="dismissError()"
       (keydown.enter)="dismissError()"
       (keydown.space)="dismissError()">
    <div class="w-full max-w-md rounded-[1.5rem] border border-red-500/20 bg-slate-900 p-5 shadow-2xl shadow-slate-950/60"
         tabindex="0"
         role="dialog"
         aria-modal="true"
         (click)="$event.stopPropagation()"
         (keydown.escape)="dismissError()">
      <div class="flex items-start gap-4">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-red-500/10 text-red-300">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>

        <div class="min-w-0 flex-1">
          <h2 class="text-lg font-semibold text-slate-50">Error</h2>
          <p class="mt-1 text-sm leading-6 text-slate-300">{{ errorMessage }}</p>
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button type="button"
                (click)="dismissError()"
                class="rounded-2xl bg-sky-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-400">
          Entendido
        </button>
      </div>
    </div>
  </div>
</div>
