<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 dark:bg-slate-900">
  <div class="w-full max-w-md rounded-3xl bg-white/95 dark:bg-slate-800/95 border border-slate-200 dark:border-slate-700 shadow-2xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-blue-600 rounded-2xl p-3 shadow-lg shadow-blue-200">
        <img src="/SmileWhite.png" alt="Logo" class="w-8 h-8 object-contain">
      </div>
      <div>
        <p class="text-xs uppercase tracking-[0.3em] text-blue-500 font-semibold">MentorCore</p>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Iniciar sesión</h1>
      </div>
    </div>

    <form class="space-y-4" (ngSubmit)="login()">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Usuario</label>
        <input id="username" type="text" [(ngModel)]="form.username" name="username" autocomplete="username"
               class="w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
               placeholder="demo o admin">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="form.password" name="password" autocomplete="current-password"
               class="w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
               placeholder="demo123 o admin123">
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full rounded-2xl bg-blue-600 py-3 font-semibold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70">
        {{ isLoading ? 'Ingresando...' : 'Entrar' }}
      </button>

      <p *ngIf="errorMessage" class="rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-600 dark:bg-red-900/20 dark:text-red-300">
        {{ errorMessage }}
      </p>
    </form>

    <p class="mt-5 text-sm text-slate-500 dark:text-slate-400 text-center">
      ¿No tienes cuenta?
      <a routerLink="/register" class="text-blue-600 dark:text-blue-300 font-semibold hover:underline">Regístrate</a>
    </p>
  </div>
</div>
