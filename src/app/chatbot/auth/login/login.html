<div class="mc-auth-shell mc-auth-shell-ink">
  <div class="mx-auto flex min-h-[calc(100dvh-3rem)] w-full max-w-md items-center justify-center sm:min-h-[calc(100dvh-4rem)]">
    <div class="mc-auth-panel w-full p-6 sm:p-10">
      <div class="mb-6 text-center sm:mb-8">
        <div class="mc-auth-badge mx-auto mb-4 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold uppercase tracking-[0.18em]">
          <img src="/SmileWhite.png" alt="MentorCore" class="h-5 w-5 object-contain">
          MentorCore
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-100">Iniciar sesión</h1>
        <p class="mc-auth-muted mt-2 text-sm leading-6">Accede con tus credenciales.</p>
      </div>

      <form class="space-y-4" (ngSubmit)="login()" autocomplete="off">
        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-slate-300">Usuario o Correo electrónico</label>
          <div class="relative">
            <i class="fa-solid fa-user pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #usernameInput id="username" type="text" [(ngModel)]="form.username" name="username" autocomplete="username"
                   (ngModelChange)="onUsernameInput()"
                   (blur)="validateUsernameField()"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="mc-auth-input w-full rounded-2xl px-11 py-3 text-sm outline-none transition"
                   placeholder="ej: alumno@correo.com">
          </div>
          <p *ngIf="fieldErrors.username" class="text-xs text-red-300">{{ fieldErrors.username }}</p>
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-slate-300">Contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #passwordInput id="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" name="password" autocomplete="current-password"
                   (ngModelChange)="onPasswordInput()"
                   (blur)="validatePasswordField()"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="mc-auth-input w-full rounded-2xl px-11 py-3 pr-12 text-sm outline-none transition"
                   placeholder="Tu contraseña">
            <button type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-700/70 hover:text-slate-100"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
          <p *ngIf="fieldErrors.password" class="text-xs text-red-300">{{ fieldErrors.password }}</p>
          <div class="flex justify-end mt-1">
            <a routerLink="/forgot-password" class="text-xs font-semibold text-blue-400 transition hover:text-blue-300">¿Olvidaste tu contraseña?</a>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading || isLoginTransitioning"
          class="mc-primary-btn flex w-full items-center justify-center rounded-2xl px-4 py-3 text-sm font-semibold transition">
          {{ isLoading ? 'Ingresando...' : 'Entrar' }}
        </button>

        <p *ngIf="errorMessage" class="rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-200">
          {{ errorMessage }}
        </p>
      </form>

      <div class="mc-auth-muted mt-5 text-center text-sm">
        <a routerLink="/register" class="mc-auth-link font-semibold transition">Crear cuenta</a>
      </div>
    </div>
  </div>

  <div *ngIf="showErrorModal && errorMessage"
       class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm"
       role="button"
       tabindex="0"
       (click)="dismissError()"
       (keydown.enter)="dismissError()"
       (keydown.space)="dismissError()">
    <div class="w-full max-w-md rounded-[1.5rem] border border-red-500/20 bg-slate-900 p-5 shadow-2xl shadow-slate-950/60"
         tabindex="0"
         role="dialog"
         aria-modal="true"
         (click)="$event.stopPropagation()"
         (keydown.escape)="dismissError()">
      <div class="flex items-start gap-4">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-red-500/10 text-red-300">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>

        <div class="min-w-0 flex-1">
          <h2 class="text-lg font-semibold text-slate-50">No se pudo iniciar sesión</h2>
          <p class="mt-1 text-sm leading-6 text-slate-300">{{ errorMessage }}</p>
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button type="button"
                (click)="dismissError()"
                class="rounded-2xl bg-sky-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-400">
          Entendido
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isLoginTransitioning"
       class="mc-login-transition fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/68 p-4 backdrop-blur-md"
       role="status"
       aria-live="polite">
    <div class="mc-login-transition-panel rounded-3xl border border-blue-200/30 bg-white/90 px-8 py-7 text-center shadow-2xl shadow-blue-950/20 dark:border-slate-700 dark:bg-slate-900/92">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-700 to-blue-500 text-white shadow-lg shadow-blue-500/25">
        <i class="fa-solid fa-book-open-reader text-lg"></i>
      </div>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-blue-700 dark:text-sky-300">MentorCore</p>
      <p class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Preparando tu espacio académico...</p>
      <div class="mt-4 h-1.5 w-48 overflow-hidden rounded-full bg-blue-100 dark:bg-slate-700">
        <span class="block h-full w-1/2 animate-pulse rounded-full bg-gradient-to-r from-blue-500 to-sky-400"></span>
      </div>
    </div>
  </div>
</div>
