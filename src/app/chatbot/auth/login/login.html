<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 px-4 py-6 text-slate-100 sm:py-8">
  <div class="mx-auto flex min-h-[calc(100dvh-3rem)] w-full max-w-md items-center justify-center sm:min-h-[calc(100dvh-4rem)]">
    <div class="w-full rounded-[1.5rem] border border-slate-700/60 bg-slate-900/85 p-6 shadow-2xl shadow-slate-950/40 backdrop-blur sm:rounded-[1.75rem] sm:p-10">
      <div class="mb-6 text-center sm:mb-8">
        <div class="mx-auto mb-4 inline-flex items-center gap-2 rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-sky-200">
          <img src="/SmileWhite.png" alt="MentorCore" class="h-5 w-5 object-contain">
          MentorCore
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-50">Iniciar sesión</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Accede con tus credenciales.</p>
      </div>

      <form class="space-y-4" (ngSubmit)="login()" autocomplete="off">
        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-slate-300">Usuario</label>
          <div class="relative">
            <i class="fa-solid fa-user pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #usernameInput id="username" type="text" [(ngModel)]="form.username" name="username" autocomplete="username"
                   (ngModelChange)="onUsernameInput()"
                   (blur)="validateUsernameField()"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="w-full rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10"
                   placeholder="Tu usuario">
          </div>
          <p *ngIf="fieldErrors.username" class="text-xs text-red-300">{{ fieldErrors.username }}</p>
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-slate-300">Contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input #passwordInput id="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" name="password" autocomplete="current-password"
                   (ngModelChange)="onPasswordInput()"
                   (blur)="validatePasswordField()"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="w-full rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 pr-12 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10"
                   placeholder="Tu contraseña">
            <button type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-700/60 hover:text-slate-200"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
          <p *ngIf="fieldErrors.password" class="text-xs text-red-300">{{ fieldErrors.password }}</p>
        </div>

        <button type="submit" [disabled]="isLoading"
                class="flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/15 transition hover:from-sky-400 hover:to-blue-500 hover:shadow-sky-500/25 disabled:cursor-not-allowed disabled:opacity-70">
          {{ isLoading ? 'Ingresando...' : 'Entrar' }}
        </button>

        <p *ngIf="errorMessage" class="rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-200">
          {{ errorMessage }}
        </p>
      </form>

      <div class="mt-5 text-center text-sm text-slate-400">
        <a routerLink="/register" class="font-semibold text-sky-300 transition hover:text-sky-200">Crear cuenta</a>
      </div>
    </div>
  </div>

  <div *ngIf="showErrorModal && errorMessage"
       class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm"
       role="button"
       tabindex="0"
       (click)="dismissError()"
       (keydown.enter)="dismissError()"
       (keydown.space)="dismissError()">
    <div class="w-full max-w-md rounded-[1.5rem] border border-red-500/20 bg-slate-900 p-5 shadow-2xl shadow-slate-950/60"
         tabindex="0"
         role="dialog"
         aria-modal="true"
         (click)="$event.stopPropagation()"
         (keydown.escape)="dismissError()">
      <div class="flex items-start gap-4">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-red-500/10 text-red-300">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>

        <div class="min-w-0 flex-1">
          <h2 class="text-lg font-semibold text-slate-50">No se pudo iniciar sesión</h2>
          <p class="mt-1 text-sm leading-6 text-slate-300">{{ errorMessage }}</p>
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button type="button"
                (click)="dismissError()"
                class="rounded-2xl bg-sky-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-400">
          Entendido
        </button>
      </div>
    </div>
  </div>
</div>
