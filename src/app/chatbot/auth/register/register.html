<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 px-4 py-6 text-slate-100 sm:py-8">
  <div class="mx-auto flex min-h-[calc(100dvh-3rem)] w-full max-w-md items-center justify-center sm:min-h-[calc(100dvh-4rem)]">
    <div class="w-full rounded-[1.5rem] border border-slate-700/60 bg-slate-900/85 p-6 shadow-2xl shadow-slate-950/40 backdrop-blur sm:rounded-[1.75rem] sm:p-10">
      <div class="mb-6 text-center sm:mb-8">
        <div class="mx-auto mb-4 inline-flex items-center gap-2 rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-sky-200">
          <img src="/SmileWhite.png" alt="MentorCore" class="h-5 w-5 object-contain">
          MentorCore
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-50">Crear cuenta</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Regístrate en pocos pasos.</p>
      </div>

      <form class="space-y-4" (ngSubmit)="register()" autocomplete="off">
        <div class="space-y-2">
          <label for="display_name" class="block text-sm font-medium text-slate-300">Nombre visible</label>
          <div class="relative">
            <i class="fa-solid fa-id-card pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input id="display_name" type="text" [(ngModel)]="form.display_name" name="display_name" autocomplete="name"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="w-full rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10"
                   placeholder="Tu nombre">
          </div>
        </div>

        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-slate-300">Usuario</label>
          <div class="relative">
            <i class="fa-solid fa-user pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input id="username" type="text" [(ngModel)]="form.username" name="username" autocomplete="username"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="w-full rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10"
                   placeholder="usuario_unico">
          </div>
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-slate-300">Contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input id="password" type="password" [(ngModel)]="form.password" name="password" autocomplete="new-password"
                   [attr.readonly]="autofillLock ? '' : null" (focus)="unlockAutofill()" (pointerdown)="unlockAutofill()"
                   class="w-full rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10"
                   placeholder="Mínimo 6 caracteres">
          </div>
        </div>

        <div class="space-y-2">
          <label for="faculty" class="block text-sm font-medium text-slate-300">Facultad</label>
          <div class="relative">
            <i class="fa-solid fa-building-columns pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <select id="faculty" [(ngModel)]="selectedFaculty" name="faculty" (ngModelChange)="onFacultyChange()"
                    class="w-full appearance-none rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10">
              <option value="" disabled>Selecciona una facultad</option>
              <option *ngFor="let faculty of facultyOptions" [value]="faculty">{{ faculty }}</option>
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label for="career" class="block text-sm font-medium text-slate-300">Carrera</label>
          <div class="relative">
            <i class="fa-solid fa-graduation-cap pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <select id="career" [(ngModel)]="form.career" name="career" [disabled]="!selectedFaculty"
                    class="w-full appearance-none rounded-2xl border border-slate-700/80 bg-slate-800/85 px-11 py-3 text-sm text-slate-100 outline-none transition focus:border-sky-400/50 focus:bg-slate-800 focus:ring-4 focus:ring-sky-400/10">
              <option value="" disabled>{{ selectedFaculty ? 'Selecciona una carrera' : 'Primero selecciona una facultad' }}</option>
              <option *ngFor="let option of filteredCareerOptions" [value]="option">{{ option }}</option>
            </select>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading"
                class="flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/15 transition hover:from-sky-400 hover:to-blue-500 hover:shadow-sky-500/25 disabled:cursor-not-allowed disabled:opacity-70">
          {{ isLoading ? 'Registrando...' : 'Registrarme' }}
        </button>

        <p *ngIf="errorMessage" class="rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-200">
          {{ errorMessage }}
        </p>

        <p *ngIf="successMessage" class="rounded-2xl border border-emerald-400/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200">
          {{ successMessage }}
        </p>
      </form>

      <div class="mt-5 text-center text-sm text-slate-400">
        <a routerLink="/login" class="font-semibold text-sky-300 transition hover:text-sky-200">Ya tengo cuenta</a>
      </div>
    </div>
  </div>
</div>
