<div class="mc-page-enter min-h-screen flex items-center justify-center bg-slate-50 px-4 dark:bg-slate-900">
  <div class="mc-card w-full max-w-lg rounded-3xl bg-white/95 dark:bg-slate-800/95 border border-slate-200 dark:border-slate-700 shadow-2xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-blue-600 rounded-2xl p-3 shadow-lg shadow-blue-200">
        <img src="/SmileWhite.png" alt="Logo" class="w-8 h-8 object-contain">
      </div>
      <div>
        <p class="text-xs uppercase tracking-[0.3em] text-blue-500 font-semibold">MentorCore</p>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Crear cuenta</h1>
      </div>
    </div>

    <form class="space-y-4" (ngSubmit)="register()">
      <div>
        <label for="display_name" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Nombre visible</label>
        <input id="display_name" type="text" [(ngModel)]="form.display_name" name="display_name"
          class="mc-input w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
          placeholder="Tu nombre completo">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Usuario</label>
          <input id="username" type="text" [(ngModel)]="form.username" name="username"
            class="mc-input w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
            placeholder="usuario_unico">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Contraseña</label>
          <input id="password" type="password" [(ngModel)]="form.password" name="password"
            class="mc-input w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
            placeholder="Mínimo 6 caracteres">
        </div>
      </div>

      <div>
        <label for="career" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Carrera</label>
        <select id="career" [(ngModel)]="form.career" name="career"
          class="mc-input w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20">
          <option value="" disabled>Selecciona tu carrera</option>
          <option *ngFor="let option of careerOptions" [value]="option">{{ option }}</option>
        </select>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="mc-button w-full rounded-2xl bg-blue-600 py-3 font-semibold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70">
        {{ isLoading ? 'Registrando...' : 'Registrarme' }}
      </button>

      <p *ngIf="errorMessage" class="rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-600 dark:bg-red-900/20 dark:text-red-300">
        {{ errorMessage }}
      </p>

      <p *ngIf="successMessage" class="rounded-2xl bg-green-50 px-4 py-3 text-sm text-green-700 dark:bg-green-900/20 dark:text-green-300">
        {{ successMessage }}
      </p>
    </form>

    <p class="mt-5 text-sm text-slate-500 dark:text-slate-400 text-center">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 dark:text-blue-300 font-semibold hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
